name: Release

# Builds the desktop installers (Windows / macOS / Linux) and attaches them to a
# GitHub Release. Trigger it by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# (or run it manually from the Actions tab).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app + publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "InternPilot ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below, then sign in with your InternPilot account."
          releaseDraft: true
          prerelease: false

      # Also publish a stable, version-less copy of each installer, so the README's
      # `releases/latest/download/InternPilot-Setup.exe` links always point at the
      # newest build (a true one-click download that never needs updating).
      - name: Publish stable-named Windows installer
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
          cp "$exe" "InternPilot-Setup.exe"
          gh release upload "${{ github.ref_name }}" "InternPilot-Setup.exe" --clobber

      - name: Publish stable-named macOS installer
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" "InternPilot.dmg"
          gh release upload "${{ github.ref_name }}" "InternPilot.dmg" --clobber

      - name: Publish stable-named Linux installer
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          cp "$appimage" "InternPilot.AppImage"
          gh release upload "${{ github.ref_name }}" "InternPilot.AppImage" --clobber
