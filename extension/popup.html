<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --surface: #fff; --surface-2: #fafbfc; --line: #e7ebf0; --line-soft: #eef1f5;
        --ink: #0f1b2d; --ink-2: #33445a; --muted: #6b7a8d; --muted-2: #98a5b4;
        --accent: #1f6feb; --accent-hover: #1a5bc4; --accent-soft: #eaf2fe; --accent-line: #c4d9fa; --accent-ink: #12509e;
        --good: #157f5f; --good-soft: #e4f3ee; --good-line: #bfe3d5;
        --warn: #a9761c; --warn-soft: #faf1de; --purple: #5a38c4; --purple-soft: #f0ebfe;
        --nav: #0e1621;
      }
      * { box-sizing: border-box; }
      body { width: 360px; margin: 0; font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: var(--ink); background: var(--surface); -webkit-font-smoothing: antialiased; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
      .hidden { display: none !important; }

      .head { display: flex; align-items: center; gap: 9px; background: var(--nav); padding: 11px 13px; }
      .head .mk { width: 22px; height: 22px; flex: none; }
      .head b { font-size: 13px; font-weight: 600; color: #fff; letter-spacing: -.015em; }
      .head .note { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: #7c8da0; }
      .head .gear { color: #7c8da0; display: grid; place-items: center; padding: 3px; border-radius: 6px; }
      .head .gear:hover { color: #fff; background: rgba(255,255,255,.08); }

      .body { padding: 14px; }
      .foot { padding: 11px 14px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }

      .status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; padding: 9px 11px; border-radius: 9px; background: var(--surface-2); color: var(--ink-2); margin-bottom: 12px; border: 1px solid var(--line-soft); }
      .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); flex: none; }
      .status.ok { background: var(--good-soft); color: var(--good); border-color: var(--good-line); }
      .status.ok::before { background: var(--good); }
      .status.err { background: #fbeae6; color: #b03d2a; border-color: #f3d3cc; }
      .status.err::before { background: #b03d2a; }

      .detected { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
      .detected .logo { width: 34px; height: 34px; border-radius: 8px; flex: none; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 600; }
      .detected .who { flex: 1; min-width: 0; }
      .detected .who b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
      .detected .who span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }

      .source { display: flex; align-items: center; gap: 7px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 8px; padding: 7px 10px; margin-bottom: 13px; }
      .source .eyebrow { color: var(--accent-ink); }
      .source b { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; color: var(--accent-ink); margin-left: auto; }

      .resume-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 12px; }
      .resume-line .ic { width: 26px; height: 26px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
      .resume-line .tx { flex: 1; min-width: 0; }
      .resume-line .tx .eyebrow { display: block; margin-bottom: 1px; }
      .resume-line .tx b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

      .btn { height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 7px; width: 100%; }
      .btn:hover { border-color: #cbd4de; background: var(--surface-2); }
      .btn.primary { background: linear-gradient(135deg, #3b85f5, #1a5bc4); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(31,111,235,.3); }
      .btn.primary:hover { filter: brightness(1.03); }
      .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
      .btn.small { height: 30px; font-size: 12px; border-radius: 8px; }
      .btnrow { display: flex; gap: 8px; }
      .btnrow > * { flex: 1; }

      .result { display: flex; align-items: center; gap: 11px; background: var(--good-soft); border: 1px solid var(--good-line); border-radius: 10px; padding: 11px 12px; margin-bottom: 14px; }
      .result .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; flex: none; }
      .result b { display: block; font-size: 13.5px; font-weight: 600; color: #0e6b50; letter-spacing: -.015em; }
      .result span { display: block; font-size: 12px; color: #2e7a61; }

      .section-label { display: flex; align-items: center; gap: 8px; margin: 0 0 9px; }
      .section-label b { font-size: 12.5px; font-weight: 600; }
      .section-label .n { font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; background: var(--warn-soft); color: var(--warn); padding: 1px 6px; border-radius: 5px; }

      .review { list-style: none; margin: 0 0 13px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .review li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 11px; background: #fff; }
      .review li + li { border-top: 1px solid var(--line-soft); }
      .review .flag { width: 18px; height: 18px; border-radius: 5px; flex: none; display: grid; place-items: center; margin-top: 1px; font-size: 11px; font-weight: 700; }
      .review .flag.blank { background: var(--warn-soft); color: var(--warn); }
      .review .flag.guess { background: var(--accent-soft); color: var(--accent); }
      .review .flag.write { background: var(--purple-soft); color: var(--purple); }
      .review .bd { flex: 1; min-width: 0; }
      .review .bd b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
      .review .bd span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 1px; }

      .idle { text-align: center; padding: 18px 12px 8px; }
      .idle .ill { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 12px; color: var(--muted-2); }
      .idle b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.015em; margin-bottom: 4px; }
      .idle p { margin: 0 0 15px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

      label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 11px 0 5px; }
      input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font: inherit; color: var(--ink); }
      input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .connect .note { font-size: 11.5px; color: var(--muted); margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <div class="head">
      <svg class="mk" viewBox="0 0 32 32" fill="none">
        <path d="M4.6 25.4 16 14l11.4 11.4" stroke="#4E93F5" stroke-opacity=".45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.4 9.6 16 4l5.6 5.6" stroke="#4E93F5" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>InternPilot</b>
      <span class="note" id="headnote"></span>
      <button class="gear" id="gear" title="Connection settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1v.3a2 2 0 11-4 0v-.2a1.6 1.6 0 00-2.8-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003.7 15a2 2 0 01-1.7-2 2 2 0 012-2 1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0011 4.7V4a2 2 0 114 0v.2a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H22a2 2 0 010 4h-.2a1.6 1.6 0 00-1.4 1.2z"/></svg>
      </button>
    </div>

    <div class="body">
      <div id="status" class="status">Checking connection…</div>

      <!-- connection settings (toggled by gear / shown when disconnected) -->
      <div id="connect" class="connect hidden">
        <label for="token">Token (app → Settings → Browser extension)</label>
        <input id="token" placeholder="paste token" />
        <label for="port">Port</label>
        <input id="port" value="8765" />
        <div class="btnrow" style="margin-top:10px">
          <button id="save-settings" class="btn small">Save</button>
          <button id="test" class="btn small">Test</button>
        </div>
      </div>

      <!-- STATE 1: form detected -->
      <div id="detected" class="hidden">
        <div class="detected">
          <span class="logo" id="job-logo"></span>
          <span class="who"><b id="job-role"></b><span id="job-company"></span></span>
        </div>
        <div class="source" id="source"><span class="eyebrow" id="ats-name">Form</span><b id="field-count"></b></div>
        <div class="resume-line hidden" id="resume">
          <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/></svg></span>
          <span class="tx"><span class="eyebrow">Résumé to attach</span><b id="resume-name"></b></span>
        </div>
        <button id="autofill" class="btn primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          <span id="fill-label">Autofill this page</span>
        </button>
        <div class="btnrow" style="margin-top:8px">
          <button id="save-only" class="btn small">Save to tracker only</button>
        </div>
      </div>

      <!-- STATE 2: filled + review -->
      <div id="result-state" class="hidden">
        <div class="result">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span><b id="result-count">Filled</b><span id="result-sub">Added to your tracker</span></span>
        </div>
        <div id="review-wrap" class="hidden">
          <div class="section-label"><b>Needs your eyes</b><span class="n" id="review-n">0</span></div>
          <ul class="review" id="review"></ul>
        </div>
        <button id="log-applied" class="btn good">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          I submitted — log as applied
        </button>
      </div>

      <!-- STATE 3: no form -->
      <div id="idle" class="hidden">
        <div class="idle">
          <span class="ill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span>
          <b>No application form here</b>
          <p>Works on Greenhouse, Lever, Workday, Ashby, iCIMS &amp; more. On an application page? Try scanning again.</p>
          <button id="scan" class="btn">Scan this page</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
